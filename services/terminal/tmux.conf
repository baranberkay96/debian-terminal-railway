# Debian Web Terminal: system-wide tmux defaults (/etc/tmux.conf).
# tmux loads ~/.tmux.conf after this file. Put your own settings there; it is
# on the volume and survives redeploys.

# Colours: tmux-256color inside, true colour from the browser terminal (xterm.js).
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Mouse wheel scrolls tmux history. Hold Shift while selecting to copy text in
# the browser.
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g set-clipboard on

# Windows and panes count from 1, like the keyboard.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# The browser tab title shows the session and window.
set -g set-titles on
set -g set-titles-string "#S:#W - Debian terminal"

# Sessions stay alive with no browser attached (tmux default, stated explicitly).
set -g destroy-unattached off

# Status bar.
set -g status-interval 15
set -g status-style "bg=colour236,fg=colour250"
set -g status-left-length 24
set -g status-left "#[fg=colour231,bg=colour161,bold] #S #[default] "
set -g status-right "#[fg=colour245]Ctrl-b c new  Ctrl-b n next  Ctrl-b d detach #[fg=colour250]%H:%M "
set -g status-right-length 80
setw -g window-status-current-style "fg=colour231,bold"
setw -g window-status-style "fg=colour245"
